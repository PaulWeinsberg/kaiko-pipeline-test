<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page Not Found | Kaiko</title>
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root { color-scheme: light dark; }
      body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; background:#0d1117; color:#f0f3f7; }
      .wrap { max-width:640px; padding:2rem; text-align:center; }
      h1 { font-size:2.5rem; margin:0 0 1rem; line-height:1.1; }
      p { line-height:1.5; margin:0 0 1.25rem; }
      a { color:#58a6ff; text-decoration:none; }
      a:hover { text-decoration:underline; }
      .home-btn { display:inline-block; margin-top:1rem; background:#1f6feb; color:#fff; padding:.75rem 1.25rem; border-radius:6px; font-weight:600; }
      .home-btn:hover { background:#388bfd; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>404</h1>
      <p>The page you were looking for doesn’t exist or was moved.</p>
      <p><a class="home-btn" href="/">Return to homepage</a></p>
    </div>
  </body>
</html>
