---
name: release

concurrency:
    cancel-in-progress: true
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

on:
    push:
        tags: ['*']

env:
    COREPACK_ENABLE_AUTO_PIN: 0
    DOCKER: ''

jobs:
    release:
        runs-on: self-hosted
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/iron
            - name: release
              id: release
              run: |
                  APP=spininteractive-institutionalwebsite
                  VERSION=$(echo ${GITHUB_REF_NAME} | sed 's#/+#-#g')
                  make release VERSION=${VERSION}
                  echo ${GOOGLE_APPLICATION_CREDENTIALS} | docker login --username _json_key --password-stdin https://gcr.io
                  docker push gcr.io/kaiko-gcr/$APP:$VERSION
                  echo "::set-output name=binary::${APP}-${VERSION}"
              env:
                  GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
                  NODE_ENV: preprod
                  BASE_URL: https://www.kaiko.ovh/
                  WP_URL: https://web-bo-i.kaiko.ovh/
                  API_URL: https://web-bo-i.kaiko.ovh/wp-json/spin-api/
                  API_KEY: '-)<X[4J9Y!zxam;S'
            - name: Release
              uses: softprops/action-gh-release@v2
              with:
                  files: build/${{ steps.release.outputs.binary }}
