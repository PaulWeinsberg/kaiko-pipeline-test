---
name: release

concurrency:
    cancel-in-progress: true
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

on:
    push:
        tags: ['*']
    workflow_dispatch:

env:
    COREPACK_ENABLE_AUTO_PIN: 0
    DOCKER: ''

jobs:
    release:
        runs-on: kaiko-arc-small
        # The tag suffix is what selects the environment, and therefore the hostnames baked into
        # the SSR image: release-please cuts `X.Y.Z-preprod.N` for preprod and a bare `X.Y.Z` for
        # production. Both environments allow `master` and tags only, so a build can no longer be
        # cut from the legacy preprod branch. A manual `workflow_dispatch` run resolves to
        # `production` (ref_name is a branch, not a tag) and tags the image after the branch, as
        # it already did.
        environment:
            name: ${{ contains(github.ref_name, '-preprod') && 'preprod' || 'production' }}
        # Read-only: the job builds and pushes to gcr.io, it no longer creates a GitHub Release
        # (release-please owns those). Only `actions/checkout` needs the contents scope.
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: lts/jod
            - name: release
              run: |
                  export DOCKER_CONFIG="$(mktemp -d)"
                  echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "$GITHUB_ENV"
                  AUTH=$(echo -n "_json_key:$(echo "${KAIKO_GCR_WRITER}" | base64 -d)" | base64 -w0)
                  printf '{"auths":{"gcr.io":{"auth":"%s"}}}\n' "$AUTH" > "$DOCKER_CONFIG/config.json"

                  APP=spininteractive-institutionalwebsite
                  VERSION=$(echo ${GITHUB_REF_NAME} | sed 's#/+#-#g')
                  make release VERSION=${VERSION}
                  docker push gcr.io/kaiko-gcr/$APP:$VERSION
              env:
                  KAIKO_GCR_WRITER: ${{ secrets.KAIKO_GCR_WRITER }}
                  NODE_ENV: prod
                  SSR_HOST: ${{ vars.SSR_HOST }}
                  SSR_PROTOCOL: https
                  STATIC_HOST: ${{ vars.STATIC_HOST }}
                  STATIC_PROTOCOL: https
                  WP_URL: ${{ vars.WP_URL }}
                  API_URL: ${{ vars.API_URL }}
                  API_KEY: ${{ vars.API_KEY }}
            - name: Cleanup docker config
              if: always()
              run: rm -rf "$DOCKER_CONFIG"
