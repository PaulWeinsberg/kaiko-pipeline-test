---
  name: release
  
  concurrency:
    cancel-in-progress: true
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  
  on:
    pull_request:
      branches: ['*']
  
  env:
    COREPACK_ENABLE_AUTO_PIN: 0
    DOCKER: ""
  
  jobs:
    release:
      runs-on: self-hosted
      permissions:
        contents: write
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 18-alpine
        - name: release
          id: release
          run: |
            APP=spininteractive-institutionalwebsite
            VERSION=$(echo ${GITHUB_REF_NAME})
            make release-image VERSION=${VERSION}
            echo ${GOOGLE_APPLICATION_CREDENTIALS} | docker login --username _json_key --password-stdin https://gcr.io
            docker push gcr.io/kaiko-gcr/$APP:$VERSION
            echo "::set-output name=binary::${APP}-${VERSION}"
          env:
            GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        - name: Release
          uses: softprops/action-gh-release@v2
          with:
            files: build/${{ steps.release.outputs.binary }}
  