name: release-please

# Maintains a single Release PR (accumulating changes since the last tag, CHANGELOG.md
# grouped by type with the WP-XX scope on each entry). The tag is created only when the
# Release PR is merged. See SRE-1570 / the portal design doc.
on:
  push:
    branches: ["master"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Authenticate as the kaiko-website-deploy-bot GitHub App (app-id + private key in
      # secrets, provisioned via terraform/github). The App token lets release-please open
      # the Release PR without the org "allow Actions to create PRs" toggle, and — key —
      # the bare tag it creates on Release-PR merge triggers release.yml (a GITHUB_TOKEN-
      # created tag would not). SRE-1570.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.WEBSITE_DEPLOY_BOT_APP_ID }}
          private-key: ${{ secrets.WEBSITE_DEPLOY_BOT_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
